services:
  - type: web
    name: sorted-api
    runtime: node
    # UPGRADE TO `starter` BEFORE WEEK 4.
    # The free tier sleeps after 15 minutes of inactivity. That is harmless
    # while building, but from week 4 it breaks two things: PayPal webhooks
    # delivered to a sleeping service, and the hourly nudge sweep, which cannot
    # run at all if nothing is awake to run it. It also gives judges a ~50s
    # cold start on the hosted demo in week 6.
    plan: free
    region: frankfurt
    rootDir: api
    # --include=dev is required, not optional. NODE_ENV=production below makes
    # npm skip devDependencies, and TypeScript is one, so a plain `npm ci`
    # leaves no tsc and the build dies with "tsc: command not found".
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Everything below is set in the Render dashboard, never in this file.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      # The service-account JSON, pasted as a single line.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
