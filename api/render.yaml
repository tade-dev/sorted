services:
  - type: web
    name: sorted-api
    runtime: node
    # NOT free: the free tier sleeps after 15 minutes, which drops PayPal
    # webhooks and gives judges ~50s cold starts on the hosted demo.
    plan: starter
    region: frankfurt
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # Everything below is set in the Render dashboard, never in this file.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      # The service-account JSON, pasted as a single line.
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
